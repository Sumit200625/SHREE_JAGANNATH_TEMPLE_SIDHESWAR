    // =========================================================================
    // CANVAS PARTICLE DRAW COMPONENT
    // =========================================================================
    function ParticleBackground() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let w = (canvas.width = canvas.offsetWidth);
        let h = (canvas.height = canvas.offsetHeight);

        const particles = [];
        const count = 30;
        const colors = ['rgba(227,95,36,', 'rgba(212,175,55,', 'rgba(243,229,171,'];

        class Spark {
          constructor() {
            this.reset();
            this.y = Math.random() * h;
          }
          reset() {
            this.x = Math.random() * w;
            this.y = h + 10;
            this.size = Math.random() * 2 + 1;
            this.speedY = -(Math.random() * 0.6 + 0.2);
            this.speedX = Math.random() * 0.3 - 0.15;
            this.alpha = Math.random() * 0.4 + 0.1;
            this.time = Math.random() * 100;
            this.sway = Math.random() * 1.5 + 0.5;
            this.color = colors[Math.floor(Math.random() * colors.length)];
          }
          update() {
            this.y += this.speedY;
            this.time += 0.01;
            this.x += this.speedX + Math.sin(this.time) * 0.1 * this.sway;
            if (this.y < h * 0.2) this.alpha -= 0.003;
            if (this.y < -10 || this.alpha <= 0) this.reset();
          }
          draw() {
            ctx.beginPath();
            const rad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2);
            rad.addColorStop(0, `${this.color}${this.alpha})`);
            rad.addColorStop(1, `${this.color}0)`);
            ctx.fillStyle = rad;
            ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        for (let i = 0; i < count; i++) particles.push(new Spark());

        let animId;
        const loop = () => {
          ctx.clearRect(0, 0, w, h);
          particles.forEach(p => { p.update(); p.draw(); });
          animId = requestAnimationFrame(loop);
        };
        loop();

        const resize = () => {
          w = canvas.width = canvas.parentElement.offsetWidth;
          h = canvas.height = canvas.parentElement.offsetHeight;
        };
        window.addEventListener('resize', resize);
        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('resize', resize);
        };
      }, []);

      return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none z-10 opacity-60" />;
    }

    function SevaBookingPanel({ allSevas, setAllSevas, user, t }) {

      const [devoteeName, setDevoteeName] = useState(user ? user.name : '');
      const [phone, setPhone] = useState(user ? user.phone : '');
      const [email, setEmail] = useState(user ? user.email : '');
      const [gotra, setGotra] = useState(user ? user.gotra || '' : '');
      const [address, setAddress] = useState(user ? user.address || '' : '');
      const [selectedDate, setSelectedDate] = useState('');
      const [familyMembers, setFamilyMembers] = useState('');
      const [loading, setLoading] = useState(false);
      const [success, setSuccess] = useState(null);

      const handleBook = (e) => {
        e.preventDefault();
        setLoading(true);

        setTimeout(() => {
          setLoading(false);
          const refNum = `SEVA-761012-${Math.floor(1000 + Math.random() * 9000)}`;
          const newBooking = {
            id: `sev_${Date.now()}`,
            bookingReference: refNum,
            devoteeName,
            phone,
            email,
            gotra,
            address,
            selectedDate,
            sevaType,
            amount: sevaType.includes('Annadan') ? 1100 : 501,
            paymentStatus: "paid",
            approvalStatus: "pending",
            createdAt: new Date().toISOString()
          };

          const list = [newBooking, ...allSevas];
          setAllSevas(list);
          localStorage.setItem('preview-sevas', JSON.stringify(list));
          setSuccess(newBooking);
        }, 500);
      };

      const downloadMockReceipt = (bk) => {
        const text = `========================================================
SEVA BOOKING SLIP - SIDHESWAR TEMPLE
========================================================
Ref Code:        ${bk.bookingReference}
Devotee Name:    ${bk.devoteeName}
Phone Number:    ${bk.phone}
Gotra:           ${bk.gotra || "N/A"}
Auspicious Date: ${bk.selectedDate}
Seva Category:   ${bk.sevaType}
Contribution:    INR ${bk.amount}/-
Payment Status:  PAID (UPI QR Code)
Approval Status: PENDING TRUST CONFIRMATION
========================================================`;
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `${bk.bookingReference}_slip.txt`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

    // =========================================================================
    // DONATION PORTAL SUB-COMPONENT
    // =========================================================================
    function DonationPanel({ allDonations, setAllDonations, user, t }) {
      const [amount, setAmount] = useState(1100);
      const [custom, setCustom] = useState('');
      const [donorName, setDonorName] = useState(user ? user.name : '');
      const [phone, setPhone] = useState(user ? user.phone : '');
      const [email, setEmail] = useState(user ? user.email : '');
      const [category, setCategory] = useState('general_fund');
      const [panNumber, setPanNumber] = useState('');
      const [isAnonymous, setIsAnonymous] = useState(false);
      const [loading, setLoading] = useState(false);
      const [success, setSuccess] = useState(null);

      const handlePreset = (val) => {
        setAmount(val);
        setCustom('');
      };

      const handleCustom = (e) => {
        setCustom(e.target.value);
        setAmount(Number(e.target.value) || 0);
      };

      const handleDonate = (e) => {
        e.preventDefault();
        if (amount <= 0) return;
        setLoading(true);

        setTimeout(() => {
          setLoading(false);
          const txnId = `TXN${Math.floor(100000000000 + Math.random() * 900000000000)}`;
          const receiptNum = `RECEIPT-2026-${Math.floor(1000 + Math.random() * 9000)}`;
          
          const newDonation = {
            id: `don_${Date.now()}`,
            donorName: isAnonymous ? 'Anonymous Devotee' : donorName || 'Devotee',
            email,
            phone,
            panNumber,
            amount,
            category,
            isAnonymous,
            paymentGateway: 'UPI',
            transactionId: txnId,
            receiptNumber: receiptNum,
            date: new Date().toISOString()
          };

          const list = [newDonation, ...allDonations];
          setAllDonations(list);
          localStorage.setItem('preview-donations', JSON.stringify(list));
          setSuccess(newDonation);
        }, 500);
      };

      const downloadDonationReceipt = (don) => {
        const text = `========================================================
HUNDI DONATION SLIP - SIDHESWAR TEMPLE
========================================================
Receipt No:     ${don.receiptNumber}
Transaction ID: ${don.transactionId}
Donor Name:     ${don.donorName}
PAN Card:       ${don.panNumber || "N/A"}
Category:       ${don.category.replace(/_/g, ' ').toUpperCase()}
Amount:         INR ${don.amount}/-
Payment Mode:   UPI Gateway
Date:           ${new Date(don.date).toLocaleString()}
========================================================`;
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `${don.receiptNumber}_slip.txt`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="animate-fadeIn max-w-4xl mx-auto px-4 py-12">
          <div className="text-center mb-8">
            <h2 className="text-2xl font-bold font-outfit text-maroon">Digital Hundi Contributions</h2>
            <div className="w-16 h-0.5 bg-gold mx-auto mt-2"></div>
          </div>

          {!success ? (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
              
              {/* Form */}
              <form onSubmit={handleDonate} className="lg:col-span-2 glass-card p-6 border-t-4 border-saffron space-y-4 box-glow text-xs font-semibold">
                
                <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl flex gap-2">
                  <i className="fa-solid fa-shield-halved text-rose-700 mt-0.5 animate-pulse"></i>
                  <p className="text-[10px] text-rose-800 leading-normal font-bold">
                    Do not transfer funds to personal phone numbers. Verify bank details.
                  </p>
                </div>

                {/* Presets */}
                <div className="space-y-1.5">
                  <label className="text-temple-700">Select Donation Amount (INR)</label>
                  <div className="grid grid-cols-4 gap-2">
                    {[501, 1100, 2500, 5001].map(v => (
                      <button key={v} type="button" onClick={() => handlePreset(v)} className={`py-2 text-center border font-outfit text-xs font-bold rounded-lg ${
                        amount === v && !custom ? 'bg-saffron text-white border-saffron shadow-sm' : 'bg-temple-50 border-saffron/10 text-temple-800 hover:bg-saffron/5'
                      }`}>₹{v}</button>
                    ))}
                  </div>
                  <input type="number" value={custom} onChange={handleCustom} placeholder="Or enter custom amount" className="w-full px-3 py-2 bg-temple-50 border border-saffron/20 rounded-xl focus:outline-none" />
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="flex flex-col space-y-1 col-span-1 sm:col-span-2">
                    <label className="text-temple-700">Donation Purpose</label>
                    <select value={category} onChange={(e) => setCategory(e.target.value)} className="px-3 py-2.5 bg-temple-50 border border-saffron/20 rounded-xl focus:outline-none">
                      <option value="general_fund">General Temple Fund</option>
                      <option value="anna_daan">Anna Daan Seva (Feeding Pilgrims)</option>
                      <option value="construction_fund">Temple Boundary Construction (Meghnad Pacheri)</option>
                    </select>
                  </div>

                  <div className="flex flex-col space-y-1">
                    <label className="text-temple-700">Donor Name</label>
                    <input type="text" disabled={isAnonymous} value={isAnonymous ? '' : donorName} onChange={(e) => setDonorName(e.target.value)} placeholder={isAnonymous ? 'Anonymous' : 'Name'} className="px-3 py-2.5 bg-temple-50 border border-saffron/20 rounded-xl focus:outline-none disabled:opacity-50" />
                  </div>
                  <div className="flex flex-col space-y-1">
                    <label className="text-temple-700">PAN Number (Optional for Tax Rebate)</label>
                    <input type="text" maxLength={10} value={panNumber} onChange={(e) => setPanNumber(e.target.value.toUpperCase())} placeholder="PAN ID" className="px-3 py-2.5 bg-temple-50 border border-saffron/20 rounded-xl focus:outline-none uppercase" />
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <input type="checkbox" id="anonCheck" checked={isAnonymous} onChange={(e) => setIsAnonymous(e.target.checked)} className="w-4 h-4 text-saffron accent-saffron cursor-pointer" />
                  <label htmlFor="anonCheck" className="cursor-pointer select-none text-[10px] uppercase font-bold text-temple-700">Make contribution anonymous</label>
                </div>

                <button type="submit" disabled={loading || amount <= 0} className="w-full py-3 bg-saffron hover:bg-saffron-dark text-white font-bold rounded-xl shadow-md transition-colors text-xs flex items-center justify-center gap-1.5">
                  <i className="fa-solid fa-qrcode"></i>
                  <span>Generate Payment QR & Complete</span>
                </button>
              </form>

              {/* Side logs */}
              <div className="space-y-4 text-xs font-semibold">
                <div className="glass-card p-5 border-t-4 border-gold space-y-3 shadow-sm">
                  <h4 className="font-bold text-temple-900 border-b pb-2"><i className="fa-solid fa-building-columns text-gold"></i> Official Bank details</h4>
                  <div className="space-y-1 text-temple-600">
                    <p>SBI Digapahandi Branch</p>
                    <p>A/C: 40012345678 (Verified)</p>
                    <p>IFSC: SBIN0001234</p>
                  </div>
                </div>
              </div>

            </div>
          ) : (
            <div className="glass-card p-8 border-t-4 border-emerald-600 space-y-5 text-center box-glow">
              <i className="fa-solid fa-circle-check text-4xl text-emerald-600 animate-pulse"></i>
              <h3 className="text-xl font-bold text-emerald-800">Donation Confirmed!</h3>
              
              <div className="p-4 bg-temple-50 border border-saffron/10 rounded-xl text-left max-w-sm mx-auto space-y-2 text-xs font-semibold">
                <p className="flex justify-between"><span className="text-temple-500">Receipt No:</span> <strong>{success.receiptNumber}</strong></p>
                <p className="flex justify-between"><span className="text-temple-500">Donor Name:</span> <span>{success.donorName}</span></p>
                <p className="flex justify-between"><span className="text-temple-500">Amount:</span> <strong className="text-maroon">₹{success.amount}</strong></p>
                <p className="flex justify-between"><span className="text-temple-500">txnId:</span> <span className="font-mono text-[10px]">{success.transactionId}</span></p>
              </div>

              <div className="flex gap-3 justify-center text-xs font-bold">
                <button onClick={() => downloadDonationReceipt(success)} className="px-4 py-2.5 bg-maroon text-cream-light rounded-xl flex items-center gap-1"><i className="fa-solid fa-file-arrow-down"></i> Download Receipt</button>
                <button onClick={() => setSuccess(null)} className="px-4 py-2.5 border border-saffron text-saffron rounded-xl">Donate Again</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // GALLERY PANEL SUB-COMPONENT
    // =========================================================================
    function GalleryPanel({ allGallery, setAllGallery, user }) {
      const [filter, setFilter] = useState('all');
      const [lightboxIdx, setLightboxIdx] = useState(-1);
      const [uploadOpen, setUploadOpen] = useState(false);
      const [title, setTitle] = useState('');
      const [url, setUrl] = useState('');
      const [cat, setCat] = useState('events');
      const [msg, setMsg] = useState('');

      const filtered = filter === 'all' ? allGallery : allGallery.filter(item => item.category === filter);

      const handleUpload = (e) => {
        e.preventDefault();
        if (!url) return;
        
        const isApproved = user && user.role !== 'devotee';
        const newItem = {
          id: `gal_${Date.now()}`,
          titleEn: title,
          category: cat,
          type: 'image',
          url,
          isApproved,
          uploadedBy: user ? user.name : 'Anonymous Devotee'
        };

        const updated = [...allGallery, newItem];
        setAllGallery(updated);
        localStorage.setItem('preview-gallery', JSON.stringify(updated));

        if (isApproved) {
          setMsg("Photo uploaded successfully!");
        } else {
          setMsg("Devotee photo submitted to administrator queue successfully!");
        }
        setTitle('');
        setUrl('');
        setTimeout(() => { setMsg(''); setUploadOpen(false); }, 3000);
      };

      return (
        <div className="animate-fadeIn max-w-5xl mx-auto px-4 py-12 space-y-8">
          <div className="text-center">

            <div className="w-16 h-0.5 bg-gold mx-auto mt-2"></div>
          </div>

            </button>

                </div>
                <div className="flex flex-col space-y-1">
                  <label className="text-temple-700">Category</label>

    // =========================================================================
    // LOGIN SUB-COMPONENT
    // =========================================================================
    function LoginPanel({ setUser, navigateTo, t }) {
      const [loginMode, setLoginMode] = useState('otp');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [phone, setPhone] = useState('');
      const [otp, setOtp] = useState('');
      const [otpSent, setOtpSent] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const handleEmailLogin = (e) => {
        e.preventDefault();
        const users = fetchTable('preview-users');
        const match = users.find(u => u.email === email && u.password === password);
        if (match) {
          setUser(match);
          if (match.role === 'devotee') navigateTo('profile');
          else navigateTo('admin');
        } else {
          setErrorMsg("Invalid credentials. Try: admin@siddheswar.org / password123");
        }
      };

      const handleSendOTP = (e) => {
        e.preventDefault();
        if (phone.length < 10) {
          setErrorMsg("Enter a valid 10-digit number.");
          return;
        }
        setErrorMsg('');
        setOtpSent(true);
      };

      const handleVerifyOTP = (e) => {
        e.preventDefault();
        if (otp !== '123456') {
          setErrorMsg("Invalid code. Use: 123456 for preview.");
          return;
        }

        const users = fetchTable('preview-users');
        let matched = users.find(u => u.phone === phone);
        if (!matched) {
          matched = { id: `usr_${Date.now()}`, name: `Devotee ${phone.slice(-4)}`, email: `user_${phone.slice(-4)}@gmail.com`, phone, role: 'devotee' };
          const updated = [...users, matched];
          saveTable('preview-users', updated);
        }
        setUser(matched);
        navigateTo('profile');
      };

      return (
        <div className="min-h-[60vh] flex items-center justify-center px-4 py-12">
          <div className="max-w-md w-full glass-card p-6 space-y-5 border-t-4 border-maroon box-glow text-xs font-semibold">
            
            <div className="text-center">
              <h2 className="text-lg md:text-xl font-bold font-outfit text-maroon">{t('templeName')}</h2>
              <span className="text-[10px] text-temple-500 font-bold uppercase mt-0.5 block">Console Authentication</span>

            <div className="flex bg-temple-50 border border-saffron/10 rounded-lg overflow-hidden text-[10px] font-bold">
              <button type="button" onClick={() => { setLoginMode('otp'); setOtpSent(false); setErrorMsg(''); }} className={`w-1/2 py-2 text-center ${loginMode==='otp'?'bg-saffron text-white':''}`}>OTP Login (Devotees)</button>
              <button type="button" onClick={() => { setLoginMode('email'); setErrorMsg(''); }} className={`w-1/2 py-2 text-center ${loginMode==='email'?'bg-saffron text-white':''}`}>Staff Login (Admin)</button>
            </div>

            {errorMsg && <div className="p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg">{errorMsg}</div>}

            {loginMode === 'otp' ? (
              <div>
                {!otpSent ? (
                  <form onSubmit={handleSendOTP} className="space-y-4">
                    <div className="flex flex-col space-y-1">
                      <label className="text-temple-700 uppercase">Mobile Number</label>
                      <input type="tel" required value={phone} onChange={(e) => setPhone(e.target.value.replace(/\D/g, '').slice(0, 10))} placeholder="10-digit number" className="px-3 py-2 bg-temple-50 border border-saffron/20 rounded-lg focus:outline-none" />
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-maroon text-cream-light hover:bg-maroon-light rounded-lg font-bold">Send OTP Code</button>
                  </form>
                ) : (
                  <form onSubmit={handleVerifyOTP} className="space-y-4">
                    <div className="flex flex-col space-y-1 text-center">
                      <label className="text-temple-700 uppercase">Verification OTP</label>
                      <input type="text" required value={otp} onChange={(e) => setOtp(e.target.value.replace(/\D/g, '').slice(0, 6))} placeholder="Verification Code" className="px-3 py-2 bg-temple-50 border border-saffron/20 rounded-lg focus:outline-none text-center font-bold tracking-widest" />
                      <span className="text-[10px] text-gold-dark font-bold mt-1 block">* For testing preview, use code: <strong>123456</strong></span>

                    <button type="submit" className="w-full py-2.5 bg-saffron hover:bg-saffron-dark text-white rounded-lg font-bold">Verify & Log In</button>
                  </form>
                )}
              </div>
            ) : (
              <form onSubmit={handleEmailLogin} className="space-y-4">
                <div className="flex flex-col space-y-1">
                  <label className="text-temple-700 uppercase">Staff Email</label>
                  <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="admin@siddheswar.org" className="px-3 py-2 bg-temple-50 border border-saffron/20 rounded-lg focus:outline-none font-semibold" />
                </div>
                <div className="flex flex-col space-y-1">
                  <label className="text-temple-700 uppercase">Password</label>
                  <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" className="px-3 py-2 bg-temple-50 border border-saffron/20 rounded-lg focus:outline-none" />

                <button type="submit" className="w-full py-2.5 bg-maroon text-cream-light hover:bg-maroon-light rounded-lg font-bold">Sign In as Staff</button>

                <div className="p-3 bg-gold/10 border border-gold/20 text-[10px] rounded-lg leading-relaxed text-temple-800">
                  <strong>Staff Credentials (testing):</strong><br />
                  Email: <strong>admin@siddheswar.org</strong><br />
                  Pass: <strong>password123</strong>

              </form>

            <div className="text-center pt-2">
              <span className="text-[11px] text-temple-500">Need devotee account? Cycle to OTP mode and send.</span>

    // =========================================================================
    // ADMIN DASHBOARD PORTAL SUB-COMPONENT
    // =========================================================================
    function AdminDashboardPanel({
      user, allSevas, setAllSevas, allDonations, allNotices, setAllNotices, allFaqs, setAllFaqs, allTickets, setAllTickets, allGallery, setAllGallery
    }) {
      const [adminTab, setAdminTab] = useState('analytics');

      // Forms
      const [nTitle, setNTitle] = useState('');
      const [nContent, setNContent] = useState('');
      const [nCat, setNCat] = useState('general');
      const [faqQ, setFaqQ] = useState('');
      const [faqA, setFaqA] = useState('');

      const handleApproveSeva = (id) => {
        const list = allSevas.map(s => s.id === id ? { ...s, approvalStatus: 'approved' } : s);
        setAllSevas(list);
        localStorage.setItem('preview-sevas', JSON.stringify(list));
      };

      const handleRejectSeva = (id) => {
        const reason = window.prompt("Enter rejection reason:");
        if (!reason) return;
        const list = allSevas.map(s => s.id === id ? { ...s, approvalStatus: 'rejected', rejectionReason: reason } : s);
        setAllSevas(list);
        localStorage.setItem('preview-sevas', JSON.stringify(list));
      };

      const handleCreateNotice = (e) => {
        e.preventDefault();
        const newNotice = {
          id: `not_${Date.now()}`,
          titleEn: nTitle,
          titleOr: nTitle,
          titleHi: nTitle,
          contentEn: nContent,
          category: nCat,
          isPinned: false,
          publishDate: new Date().toISOString().split('T')[0],
          expiryDate: "2026-12-31"
        };
        const list = [newNotice, ...allNotices];
        setAllNotices(list);
        localStorage.setItem('preview-notices', JSON.stringify(list));
        setNTitle('');
        setNContent('');
      };

      const handleDeleteNotice = (id) => {
        const filtered = allNotices.filter(n => n.id !== id);
        setAllNotices(filtered);
        localStorage.setItem('preview-notices', JSON.stringify(filtered));
      };

      const handleCreateFAQ = (e) => {
        e.preventDefault();
        const newFAQ = {
          id: `faq_${Date.now()}`,
          questionEn: faqQ,
          answerEn: faqA
        };
        const list = [...allFaqs, newFAQ];
        setAllFaqs(list);
        localStorage.setItem('preview-faqs', JSON.stringify(list));
        setFaqQ('');
        setFaqA('');
      };

      const handleDeleteFAQ = (id) => {
        const filtered = allFaqs.filter(f => f.id !== id);
        setAllFaqs(filtered);
        localStorage.setItem('preview-faqs', JSON.stringify(filtered));
      };

      const handleResolveTicket = (id) => {
        const notes = window.prompt("Enter resolution note details:");
        if (!notes) return;
        const list = allTickets.map(t => t.id === id ? { ...t, status: 'resolved', adminNotes: notes } : t);
        setAllTickets(list);
        localStorage.setItem('preview-tickets', JSON.stringify(list));
      };

      // Backup Download
      const handleBackup = () => {
        const tables = { sevas: allSevas, donations: allDonations, notices: allNotices, faqs: allFaqs, tickets: allTickets, gallery: allGallery };
        const jsonString = `data:text/json;charset=utf-8,${encodeURIComponent(JSON.stringify(tables, null, 2))}`;
        const link = document.createElement('a');
        link.href = jsonString;
        link.setAttribute('download', `temple_console_backup.json`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const allowedTabs = [
        { code: 'analytics', label: 'Analytics Overview', icon: 'fa-chart-line', roles: ['super_admin', 'donation_manager', 'seva_manager'] },
        { code: 'sevas', label: 'Manage Sevas', icon: 'fa-gift', roles: ['super_admin', 'seva_manager'] },
        { code: 'donations', label: 'Manage Donations', icon: 'fa-heart', roles: ['super_admin', 'donation_manager'] },
        { code: 'notices', label: 'Manage Notices', icon: 'fa-bullhorn', roles: ['super_admin', 'content_editor', 'notice_manager'] },
        { code: 'tickets', label: 'Inquiry Tickets', icon: 'fa-clipboard-list', roles: ['super_admin', 'content_editor'] },
        { code: 'faqs', label: 'Manage FAQs', icon: 'fa-circle-question', roles: ['super_admin', 'content_editor'] },
        { code: 'backup', label: 'Maintenance Backups', icon: 'fa-database', roles: ['super_admin'] }
      ].filter(t => t.roles.includes(user.role));

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col lg:flex-row text-xs font-semibold">
          {/* Sub sidebar */}
          <div className="w-full lg:w-56 bg-temple-dark text-cream-light p-4 space-y-4 shrink-0 font-outfit border-r border-gold/15">
            <div className="border-b border-white/10 pb-2">
              <h4 className="font-extrabold uppercase text-[11px]">Console Controls</h4>
              <p className="text-[10px] text-cream-light/60 font-semibold">{user.name.split(' ')[0]} ({user.role})</p>
            </div>
            <nav className="space-y-1 font-bold flex flex-row lg:flex-col overflow-x-auto lg:overflow-x-visible no-scrollbar">
              {allowedTabs.map(tab => (
                <button 
                  key={tab.code} 
                  onClick={() => setAdminTab(tab.code)} 
                  className={`w-full text-left px-3 py-2 rounded-lg flex items-center gap-2 whitespace-nowrap ${
                    adminTab === tab.code ? 'bg-saffron text-white' : 'hover:bg-white/5 text-cream-light/80'
                  }`}
                >
                  <i className={`fa-solid ${tab.icon}`}></i>
                  <span>{tab.label}</span>
                </button>
              ))}
            </nav>
          </div>

          {/* Sub content workspace */}
          <div className="flex-grow p-6 space-y-6">
            <div className="flex justify-between items-center border-b pb-3">
              <h3 className="text-base md:text-lg font-bold font-outfit text-maroon capitalize">{adminTab.replace('_', ' ')} Panel</h3>
              <span className="text-[10px] font-bold text-temple-500 uppercase">System Sync Ok</span>
            </div>

            {/* Analytics */}
            {adminTab === 'analytics' && (
              <div className="space-y-6 animate-fadeIn">
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 text-center">
                  <div className="bg-white p-4 border border-saffron/10 rounded-xl">
                    <span className="text-[9px] text-temple-500 uppercase font-bold block">Digital Hundi</span>
                    <strong className="text-xl font-outfit text-maroon block mt-1">₹{allDonations.reduce((sum, d) => sum + Number(d.amount), 0)}</strong>
                  </div>
                  <div className="bg-white p-4 border border-saffron/10 rounded-xl">
                    <span className="text-[9px] text-temple-500 uppercase font-bold block">Donors Logged</span>
                    <strong className="text-xl font-outfit text-saffron block mt-1">{allDonations.length}</strong>
                  </div>
                  <div className="bg-white p-4 border border-saffron/10 rounded-xl">
                    <span className="text-[9px] text-temple-500 uppercase font-bold block">Pending Sevas</span>
                    <strong className="text-xl font-outfit text-gold-dark block mt-1">{allSevas.filter(s=>s.approvalStatus==='pending').length}</strong>
                  </div>
                  <div className="bg-white p-4 border border-saffron/10 rounded-xl">
                    <span className="text-[9px] text-temple-500 uppercase font-bold block">Open Tickets</span>
                    <strong className="text-xl font-outfit text-emerald-800 block mt-1">{allTickets.filter(t=>t.status==='open').length}</strong>
                  </div>
                </div>
              </div>
            )}

            {/* Sevas */}
            {adminTab === 'sevas' && (
              <div className="bg-white p-4 rounded-xl border border-saffron/10 space-y-4 animate-fadeIn">
                <h4 className="font-bold text-sm text-temple-900 border-b pb-2">Seva Bookings Approval board</h4>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-temple-800">
                    <thead>
                      <tr className="bg-slate-50 border-b border-saffron/10 text-[10px] text-temple-500 uppercase">
                        <th className="p-2">Reference</th>
                        <th className="p-2">Devotee</th>
                        <th className="p-2">Seva</th>
                        <th className="p-2">Date</th>
                        <th className="p-2">Amount</th>
                        <th className="p-2 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-saffron/5 font-semibold">
                      {allSevas.map(s => (
                        <tr key={s.id} className="hover:bg-slate-50/50">
                          <td className="p-2 font-bold text-saffron">{s.bookingReference}</td>
                          <td className="p-2">{s.devoteeName}</td>
                          <td className="p-2">{s.sevaType}</td>
                          <td className="p-2">{s.selectedDate}</td>
                          <td className="p-2 text-maroon font-bold font-outfit">₹{s.amount}</td>
                          <td className="p-2 text-right space-x-1.5">
                            {s.approvalStatus === 'pending' ? (
                              <>
                                <button onClick={() => handleApproveSeva(s.id)} className="px-2 py-0.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded">Approve</button>
                                <button onClick={() => handleRejectSeva(s.id)} className="px-2 py-0.5 bg-rose-600 hover:bg-rose-700 text-white rounded">Reject</button>
                              </>
                            ) : (
                              <span className={`px-2 py-0.5 rounded text-[9px] font-bold ${
                                s.approvalStatus === 'approved' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'
                              }`}>{s.approvalStatus.toUpperCase()}</span>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* Donations */}
            {adminTab === 'donations' && (
              <div className="bg-white p-4 rounded-xl border border-saffron/10 space-y-4 animate-fadeIn">
                <h4 className="font-bold text-sm text-temple-900 border-b pb-2">Donations transparency ledger</h4>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-temple-800">
                    <thead>
                      <tr className="bg-slate-50 border-b border-saffron/10 text-[10px] text-temple-500 uppercase">
                        <th className="p-2">Receipt No</th>
                        <th className="p-2">Donor</th>
                        <th className="p-2">Purpose</th>
                        <th className="p-2">txnId</th>
                        <th className="p-2">Amount</th>
                        <th className="p-2">Date</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-saffron/5 font-semibold">
                      {allDonations.map(d => (
                        <tr key={d.id}>
                          <td className="p-2 font-bold text-saffron">{d.receiptNumber}</td>
                          <td className="p-2">{d.donorName}</td>
                          <td className="p-2 capitalize">{d.category.replace(/_/g, ' ')}</td>
                          <td className="p-2 text-[10px] text-temple-500 font-mono">{d.transactionId}</td>
                          <td className="p-2 text-maroon font-bold font-outfit">₹{d.amount}</td>
                          <td className="p-2 text-temple-500">{new Date(d.date).toLocaleDateString()}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* Notices */}
            {adminTab === 'notices' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-fadeIn">
                {/* Form */}
                <form onSubmit={handleCreateNotice} className="bg-white p-5 rounded-xl border border-saffron/10 space-y-4 h-fit">
                  <h4 className="font-bold text-sm text-temple-900">Publish Notice</h4>
                  <div className="flex flex-col space-y-1">
                    <label>Notice Title</label>
                    <input type="text" required value={nTitle} onChange={(e) => setNTitle(e.target.value)} placeholder="Title" className="px-3 py-2 bg-slate-50 border border-saffron/15 rounded-lg focus:outline-none" />
                  </div>
                  <div className="flex flex-col space-y-1">
                    <label>Notice Content</label>
                    <textarea rows={3} required value={nContent} onChange={(e) => setNContent(e.target.value)} placeholder="Announcement details..." className="px-3 py-2 bg-slate-50 border border-saffron/15 rounded-lg focus:outline-none resize-none" />
                  </div>
                  <div className="flex flex-col space-y-1">
                    <label>Notice Category</label>
                    <select value={nCat} onChange={(e) => setNCat(e.target.value)} className="px-3 py-2 bg-slate-50 border border-saffron/15 rounded-lg focus:outline-none">
                      <option value="general">General</option>
                      <option value="urgent">Urgent</option>
                      <option value="closure">Closure</option>
                    </select>
                  </div>
                  <button type="submit" className="w-full py-2 bg-saffron text-white rounded-lg font-bold">Publish Notice</button>
                </form>

                {/* List */}
                <div className="lg:col-span-2 bg-white p-5 rounded-xl border border-saffron/10 space-y-3">
                  <h4 className="font-bold text-sm text-temple-900 border-b pb-2">Published Board</h4>
                  <div className="space-y-3">
                    {allNotices.map(n => (
                      <div key={n.id} className="p-3 bg-slate-50 border border-saffron/5 rounded-lg flex justify-between gap-3">
                        <div>
                          <span className="text-[9px] text-saffron uppercase block">{n.category}</span>
                          <h5 className="font-bold text-temple-800 mt-0.5">{n.titleEn}</h5>
                          <p className="text-[10px] text-temple-600 mt-1 leading-normal">{n.contentEn}</p>
                        </div>
                        <button onClick={() => handleDeleteNotice(n.id)} className="text-rose-600 self-start p-1.5"><i className="fa-solid fa-trash-can"></i></button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* Tickets */}
            {adminTab === 'tickets' && (
              <div className="bg-white p-4 rounded-xl border border-saffron/10 space-y-4 animate-fadeIn">
                <h4 className="font-bold text-sm text-temple-900 border-b pb-2">Devotee Inquiries & Fraud Reports</h4>
                <div className="space-y-3">
                  {allTickets.map(t => (
                    <div key={t.id} className="p-3 bg-slate-50 rounded-lg border border-saffron/10 flex justify-between items-start gap-4">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="text-saffron font-bold text-[9px]">{t.ticketNumber}</span>
                          <span className="text-[9px] bg-slate-200 px-2 py-0.5 rounded-full capitalize">{t.type.replace(/_/g, ' ')}</span>
                          <span className={`text-[9px] px-1.5 rounded ${t.status==='resolved'?'bg-emerald-100 text-emerald-800':'bg-amber-100 text-amber-800'}`}>{t.status.toUpperCase()}</span>
                        </div>
                        <h4 className="font-bold text-temple-800 mt-1">{t.subject}</h4>
                        <p className="text-[10px] text-temple-600 mt-1">{t.message}</p>
                        {t.adminNotes && <p className="text-[10px] text-emerald-800 mt-2 font-bold"><i className="fa-solid fa-circle-check"></i> Resolution: {t.adminNotes}</p>}
                      </div>

                      {t.status === 'open' && (
                        <button onClick={() => handleResolveTicket(t.id)} className="px-2 py-1 bg-saffron text-white rounded text-[10px]">Resolve</button>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* FAQs */}
            {adminTab === 'faqs' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-fadeIn">
                <form onSubmit={handleCreateFAQ} className="bg-white p-5 rounded-xl border border-saffron/10 space-y-4 h-fit">
                  <h4 className="font-bold text-sm text-temple-900">Add New FAQ</h4>
                  <div className="flex flex-col space-y-1">
                    <label>FAQ Question</label>
                    <input type="text" required value={faqQ} onChange={(e) => setFaqQ(e.target.value)} className="px-3 py-2 bg-slate-50 border border-saffron/15 rounded-lg focus:outline-none" />
                  </div>
                  <div className="flex flex-col space-y-1">
                    <label>FAQ Answer</label>
                    <textarea rows={3} required value={faqA} onChange={(e) => setFaqA(e.target.value)} className="px-3 py-2 bg-slate-50 border border-saffron/15 rounded-lg focus:outline-none resize-none" />
                  </div>
                  <button type="submit" className="w-full py-2 bg-saffron text-white rounded-lg font-bold">Add FAQ</button>
                </form>

                <div className="lg:col-span-2 bg-white p-5 rounded-xl border border-saffron/10 space-y-3">
                  <h4 className="font-bold text-sm text-temple-900 border-b pb-2">Active FAQ Cards</h4>
                  <div className="space-y-3">
                    {allFaqs.map(f => (
                      <div key={f.id} className="p-3 bg-slate-50 rounded-lg border border-saffron/5 flex justify-between gap-3">
                        <div>
                          <h5 className="font-bold text-temple-900">{f.questionEn}</h5>
                          <p className="text-[10px] text-temple-600 mt-1 leading-normal font-medium">{f.answerEn}</p>
                        </div>
                        <button onClick={() => handleDeleteFAQ(f.id)} className="text-rose-600 self-start p-1.5"><i className="fa-solid fa-trash-can"></i></button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* Backups */}
            {adminTab === 'backup' && (
              <div className="bg-white p-6 rounded-xl border border-saffron/10 max-w-sm space-y-3 animate-fadeIn">
                <h4 className="font-bold text-sm text-temple-900"><i className="fa-solid fa-database text-saffron"></i> Database Administration</h4>
                <p className="text-[10px] text-temple-600 leading-normal font-medium">Backup devotee accounts, transaction lists, notice records, and log activities. Saves a compile-ready JSON file.</p>
                <button onClick={handleBackup} className="px-4 py-2 bg-saffron text-white font-bold rounded-lg hover:bg-saffron-dark transition-colors">Download JSON Backup</button>
              </div>
            )}

          </div>
        </div>
      );
    }

    // Mount to Root DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

  </script>
</body>
</html>
